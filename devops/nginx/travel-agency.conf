# À installer comme site Nginx hôte (par ex. /etc/nginx/sites-available/travel-agency)
# puis activer le lien dans sites-enabled et recharger Nginx.
# Docker n'expose volontairement le frontend React que sur 127.0.0.1:8080 :
# le port public 80 reste la responsabilité de ce reverse-proxy.
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.88.226;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
