services:
  database:
    image: postgres:16-alpine
    container_name: travel_db
    restart: always
    env_file:
      - ./database/.env.db   # ✅ OK
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - travel_network

  backend:
    build: ./backend
    container_name: travel_backend
    restart: always
    env_file:
      - ./database/.env.db   # 🔄 CORRIGÉ : pointe vers .env.db au lieu de .env
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - travel_network

  frontend:
    build: ./frontend
    container_name: travel_frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - travel_network

networks:
  travel_network:
    driver: bridge

volumes:
  pgdata: