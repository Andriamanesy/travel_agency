services:
  database:
    image: postgres:15-alpine
    container_name: travel_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-briandri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Economie@2021}
      POSTGRES_DB: ${POSTGRES_DB:-travel_agency_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - travel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-briandri} -d ${POSTGRES_DB:-travel_agency_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: travel_backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: database
      DB_USER: ${DB_USER:-${POSTGRES_USER:-briandri}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-Economie@2021}}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-travel_agency_db}}
      # URL publique utilisée dans les liens de vérification et de réinitialisation.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://192.168.88.226:8080}
      # Secret long et aléatoire obligatoire : ne jamais fournir de valeur par défaut.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Définissez JWT_ACCESS_SECRET avant le déploiement}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - travel-net
    volumes:
      - ./uploads:/app/public/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: travel_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - travel-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  travel-net:
    driver: bridge