services:
  db:
    image: postgres:15-alpine
    container_name: travel_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-travel_agency_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - travel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    container_name: travel_migrate
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${DB_NAME:-travel_agency_db}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "migrate"]
    volumes:
      - ./database/migrations:/app/migrations:ro
    networks:
      - travel-net
    restart: "no"

  backend:
    build: ./backend
    container_name: travel_backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${DB_NAME:-travel_agency_db}
      # Doit correspondre exactement à l'origine publique (IP ou domaine),
      # afin que les liens e-mail et les cookies restent sur la même origine.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      # Mail settings: in dev default to MailHog service added below
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@travel-agency.local}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - travel-net
    volumes:
      - ./uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend-react
    container_name: travel_frontend
    ports:
      # Le site est exposé directement sur l'origine HTTP standard. Définir
      # FRONTEND_PORT permet de conserver un port alternatif en développement.
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - travel-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: travel_mailhog
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    networks:
      - travel-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  travel-net:
    driver: bridge
