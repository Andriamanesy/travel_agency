services:
  db:
    image: postgres:15-alpine
    container_name: travel_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-briandri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Economie@2021}
      POSTGRES_DB: ${POSTGRES_DB:-travel_agency_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - travel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-briandri} -d ${POSTGRES_DB:-travel_agency_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    container_name: travel_migrate
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-briandri}
      DB_PASSWORD: ${DB_PASSWORD:-Economie@2021}
      DB_NAME: ${DB_NAME:-travel_agency_db}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "migrate"]
    volumes:
      - ./database/migrations:/app/migrations:ro
    networks:
      - travel-net
    restart: "no"

  backend:
    build: ./backend
    container_name: travel_backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_USER: ${DB_USER:-briandri}
      DB_PASSWORD: ${DB_PASSWORD:-Economie@2021}
      DB_NAME: ${DB_NAME:-travel_agency_db}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://192.168.88.226:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Définissez JWT_ACCESS_SECRET avant le déploiement}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - travel-net
    volumes:
      - ./uploads:/app/public/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: travel_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - travel-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  travel-net:
    driver: bridge
