server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compatibilité avec les URLs présentes dans les e-mails générés par le backend
    # et les favoris de l'ancienne application.
    location = /index.html { return 301 /; }
    location = /login.html { return 301 /login; }
    location = /register.html { return 301 /register; }
    location = /verify-email.html { return 302 /verify-email$is_args$args; }
    location = /forgot-password.html { return 301 /forgot-password; }
    location = /reset-password.html { return 302 /reset-password$is_args$args; }
    location = /change-password.html { return 301 /change-password; }
    location = /dashboard.html { return 301 /dashboard; }
    location = /profile.html { return 301 /profile; }
    location = /my-bookings.html { return 301 /bookings; }
    location = /destination.html { return 301 /destinations; }
    location = /destination-detail.html { return 301 /destinations; }
    location = /catalog.html { return 301 /catalog/circuits; }
    location = /catalog-detail.html { return 301 /catalog/circuits; }
    location = /booking.html { return 301 /destinations; }
    location = /admin.html { return 301 /admin; }
    location = /admin-bookings.html { return 301 /admin/bookings; }
    location = /admin-destinations.html { return 301 /admin/destinations; }
    location = /admin-catalog.html { return 301 /admin/catalog/circuits; }

    # L'API et les médias restent servis par Node : une seule origine évite CORS.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les deep links React (/destinations/:id, /bookings, etc.) retournent index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
