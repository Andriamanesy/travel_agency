<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Travel Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-8 md:px-8">
        <header class="mb-8 flex flex-col gap-4 rounded-3xl bg-slate-900 px-6 py-6 text-white shadow-xl md:flex-row md:items-center md:justify-between">
            <div>
                <p class="text-xs font-bold uppercase tracking-widest text-blue-300">Travel Agency</p>
                <h1 class="mt-1 text-2xl font-extrabold">Panneau d’administration</h1>
            </div>
            <nav class="flex gap-4 text-sm font-semibold">
                <a class="rounded-xl bg-white/10 px-4 py-2 hover:bg-white/20" href="dashboard.html">Tableau de bord</a>
                <a class="rounded-xl bg-white/10 px-4 py-2 hover:bg-white/20" href="index.html">Voir le site</a>
            </nav>
        </header>

        <main class="space-y-8">
            <section class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
                <div class="mb-5 flex items-center justify-between"><div><h2 class="text-xl font-bold">Gestion des utilisateurs</h2><p class="text-sm text-slate-500">Les changements de rôle invalident les sessions actives.</p></div></div>
                <div id="error-message" class="mb-4 rounded-xl bg-rose-50 p-4 text-sm font-medium text-rose-700" style="display: none;"></div>
                <div id="success-message" class="mb-4 rounded-xl bg-emerald-50 p-4 text-sm font-medium text-emerald-700" style="display: none;"></div>
                
                <div class="overflow-x-auto"><table class="min-w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-slate-200 text-xs uppercase tracking-wide text-slate-500">
                            <th>ID</th>
                            <th>E-mail</th>
                            <th>Statut</th>
                            <th>Rôle actuel</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-slate-100">
                        <!-- Les utilisateurs seront injectés ici par JavaScript -->
                    </tbody>
                </table></div>
            </section>

            <section class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
                <h2 class="mb-5 text-xl font-bold">Gestion des destinations</h2>
                <div id="destinations-error-message" class="mb-4 rounded-xl bg-rose-50 p-4 text-sm font-medium text-rose-700" style="display: none;"></div>
                <div id="destinations-success-message" class="mb-4 rounded-xl bg-emerald-50 p-4 text-sm font-medium text-emerald-700" style="display: none;"></div>

                <form id="destination-form" class="grid gap-4 mb-8">
                    <input type="hidden" id="destinationId">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="destinationTitle" placeholder="Titre de la destination" class="w-full px-4 py-3 border rounded-xl" required>
                        <input type="text" id="destinationLocation" placeholder="Lieu (pays / ville)" class="w-full px-4 py-3 border rounded-xl" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="number" step="0.01" min="0" id="destinationPrice" placeholder="Prix (€)" class="w-full px-4 py-3 border rounded-xl" required>
                        <input type="text" id="destinationImageUrl" placeholder="URL de l'image de couverture" class="w-full px-4 py-3 border rounded-xl">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Image de couverture</label>
                            <input type="file" id="destinationCoverFile" accept="image/jpeg,image/png,image/webp" class="w-full text-sm text-slate-700 border rounded-xl px-4 py-3" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Galerie de destination</label>
                            <input type="file" id="destinationGalleryFiles" accept="image/jpeg,image/png,image/webp" multiple class="w-full text-sm text-slate-700 border rounded-xl px-4 py-3" />
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="destinationIsActive" checked>
                        <label for="destinationIsActive" class="text-sm text-slate-700">Destination active</label>
                    </div>
                    <textarea id="destinationDescription" rows="4" placeholder="Description détaillée" class="w-full px-4 py-3 border rounded-xl" required></textarea>
                    <div class="flex flex-wrap gap-2">
                        <button id="destinationSaveBtn" type="submit" class="bg-blue-600 text-white px-5 py-3 rounded-xl font-semibold">Enregistrer</button>
                        <button id="destinationResetBtn" type="button" class="bg-slate-100 text-slate-700 px-4 py-3 rounded-xl border border-slate-200">Réinitialiser</button>
                    </div>
                </form>

                <div class="overflow-x-auto"><table class="min-w-full text-left text-sm">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Titre</th>
                            <th>Lieu</th>
                            <th>Prix</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="destinations-table-body" class="divide-y divide-slate-100">
                        <!-- Les destinations seront injectées ici -->
                    </tbody>
                </table></div>
            </section>
        </main>
    </div>

    <script src="/js/config.js" defer></script>
    <script src="/js/pages/admin.js" type="module"></script>
</body>
</html>
