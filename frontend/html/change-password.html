<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer le mot de passe — TravelMS</title>
    <link rel="icon" href="/assets/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-slate-100 to-slate-200 px-4 font-sans text-slate-800">
    <main class="w-full max-w-md rounded-3xl border border-slate-100 bg-white p-8 shadow-xl md:p-10">
        <div class="mb-8 text-center">
            <div class="mb-4 text-4xl">🔒</div>
            <h1 class="text-2xl font-extrabold text-slate-900">Changer le mot de passe</h1>
            <p class="mt-2 text-sm text-slate-500">Choisissez un nouveau mot de passe d’au moins 6 caractères.</p>
        </div>

        <form id="change-password-form" class="space-y-5">
            <div>
                <label for="current-password" class="mb-2 block text-sm font-semibold text-slate-700">Mot de passe actuel</label>
                <input id="current-password" type="password" required autocomplete="current-password" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>
            <div>
                <label for="new-password" class="mb-2 block text-sm font-semibold text-slate-700">Nouveau mot de passe</label>
                <input id="new-password" type="password" required minlength="6" autocomplete="new-password" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>
            <div>
                <label for="confirm-password" class="mb-2 block text-sm font-semibold text-slate-700">Confirmer le nouveau mot de passe</label>
                <input id="confirm-password" type="password" required minlength="6" autocomplete="new-password" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>
            <p id="form-message" class="hidden rounded-xl px-4 py-3 text-sm" role="alert"></p>
            <button id="submit-btn" type="submit" class="w-full rounded-xl bg-blue-600 px-6 py-3.5 font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:bg-blue-700">Mettre à jour le mot de passe</button>
        </form>
        <a href="/profile.html" class="mt-6 block text-center text-sm font-semibold text-blue-600 hover:underline">← Retour au profil</a>
    </main>
    <script src="/js/config.js"></script>
    <script src="/js/pages/change-password.js"></script>
</body>
</html>
