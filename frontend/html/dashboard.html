<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMS - Mon Tableau de bord</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- NAVIGATION -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-black text-blue-600 tracking-tight">Travel<span class="text-slate-900">MS</span></a>
            
            <div class="flex items-center space-x-6">
                <!-- Sélecteur de langue -->
                <select id="langSwitch" class="bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600 cursor-pointer">
                    <option value="fr">🇫🇷 FR</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="ru">🇷🇺 RU</option>
                    <option value="it">🇮🇹 IT</option>
                    <option value="zh">🇨🇳 ZH</option>
                </select>

                <button id="logoutBtn" class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-4 py-2 rounded-xl font-medium transition text-sm">
                    Déconnexion
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL DU DASHBOARD -->
    <main class="pt-28 pb-16 max-w-5xl mx-auto px-6">
        
        <!-- En-tête de bienvenue -->
        <div class="mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div class="flex items-center space-x-4">
                <!-- Avatar / Photo de profil (Niveau 2) -->
                <div class="relative">
                    <img id="avatarDisplay" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Avatar" class="w-16 h-16 rounded-full object-cover border-2 border-blue-600 shadow-md">
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-slate-900">Bonjour, <span id="userNameDisplay" class="text-blue-600">Voyageur</span> 👋</h1>
                    <p class="text-slate-500 text-sm mt-1">Complétez votre profil pour pouvoir effectuer une réservation en toute sérénité.</p>
                </div>
            </div>
            <div class="bg-amber-50 text-amber-700 px-4 py-2 rounded-2xl text-xs font-bold uppercase tracking-wider">
                Profil Partiel
            </div>
        </div>

        <!-- Grille des sections du Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Colonne de gauche : Navigation interne -->
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-2 h-fit">
                <a href="#profile" class="flex items-center space-x-3 px-4 py-3 rounded-2xl bg-blue-50 text-blue-600 font-semibold transition">
                    <span>👤</span> <span>Mon Profil (Niveau 2)</span>
                </a>
                <a href="#reservations" class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-slate-600 hover:bg-slate-50 font-medium transition">
                    <span>✈️</span> <span>Mes Réservations</span>
                </a>
                <a href="#security" class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-slate-600 hover:bg-slate-50 font-medium transition">
                    <span>🔒</span> <span>Sécurité</span>
                </a>
            </div>

            <!-- Colonne de droite : Formulaire étendu (Niveau 2 — Profil Complet) -->
            <div class="md:col-span-2 bg-white p-8 rounded-3xl border border-slate-100 shadow-sm space-y-6">
                <div class="border-b border-slate-100 pb-4">
                    <h2 class="text-xl font-bold text-slate-900">Informations du Profil</h2>
                    <p class="text-slate-500 text-sm">Renseignez vos informations personnelles (optionnelles mais requises pour voyager).</p>
                </div>

                <!-- Message de succès / alerte -->
                <div id="alertBox" class="hidden p-4 rounded-2xl text-sm font-medium"></div>

                <form id="profileForm" class="space-y-4">
                    <!-- Informations de base -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Nom complet</label>
                            <input type="text" id="fullName" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Adresse e-mail</label>
                            <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                    </div>

                    <!-- Niveau 2 — Champs additionnels -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Téléphone</label>
                            <input type="tel" id="phone" placeholder="+261 34 00 000 00" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Date de naissance</label>
                            <input type="date" id="birthdate" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Sexe</label>
                            <select id="gender" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                                value="" disabled selected>Sélectionner</option>
                                <option value="Féminin">Féminin</option>
                                <option value="Masculin">Masculin</option>
                                <option value="Autre">Autre / Non spécifié</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Nationalité</label>
                            <input type="text" id="nationality" placeholder="Malgache, Française..." class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                    </div>

                    <!-- Adresse détaillée -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Adresse postale</label>
                        <input type="text" id="address" placeholder="Lot IVX 123 Bis..." class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Ville</label>
                            <input type="text" id="city" placeholder="Antananarivo" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Pays</label>
                            <input type="text" id="country" placeholder="Madagascar" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Code postal</label>
                            <input type="text" id="postalCode" placeholder="101" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Langue préférée</label>
                            <select id="preferredLang" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                                <option value="fr">Français</option>
                                <option value="en">English</option>
                                <option value="es">Español</option>
                                <option value="ru">Русский</option>
                                <option value="it">Italiano</option>
                                <option value="zh">中文</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">URL de la photo de profil</label>
                            <input type="url" id="avatar" placeholder="https://exemple.com/photo.jpg" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                    </div>

                    <div class="pt-4 flex justify-end">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl shadow-lg shadow-blue-600/20 transition text-sm">
                            Mettre à jour mon profil
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <!-- SCRIPT DE GESTION DU PROFIL ÉTENDU -->
    <script>
        // Vérification de la session
        const token = localStorage.getItem('token');
        let userData = JSON.parse(localStorage.getItem('travelms_user') || localStorage.getItem('user') || '{}');

        if (!token && !userData.email) {
            window.location.href = 'login.html';
        }

        // Pré-remplissage des champs avec les données stockées
        document.getElementById('fullName').value = userData.name || userData.fullName || '';
        document.getElementById('email').value = userData.email || '';
        document.getElementById('phone').value = userData.phone || '';
        document.getElementById('birthdate').value = userData.birthdate || '';
        document.getElementById('gender').value = userData.gender || '';
        document.getElementById('nationality').value = userData.nationality || '';
        document.getElementById('address').value = userData.address || '';
        document.getElementById('city').value = userData.city || '';
        document.getElementById('country').value = userData.country || '';
        document.getElementById('postalCode').value = userData.postalCode || '';
        document.getElementById('preferredLang').value = userData.preferredLang || 'fr';
        document.getElementById('avatar').value = userData.avatar || '';

        // Affichage dynamique dans l'en-tête
        document.getElementById('userNameDisplay').textContent = userData.name || userData.fullName || 'Voyageur';
        if (userData.avatar) {
            document.getElementById('avatarDisplay').src = userData.avatar;
        }

        // Gestion de la soumission du formulaire de profil (Niveau 2)
        const profileForm = document.getElementById('profileForm');
        const alertBox = document.getElementById('alertBox');

        profileForm.addEventListener('submit', (e) => {
            e.preventDefault();

            // Mise à jour de l'objet utilisateur
            userData.name = document.getElementById('fullName').value;
            userData.fullName = userData.name;
            userData.email = document.getElementById('email').value;
            userData.phone = document.getElementById('phone').value;
            userData.birthdate = document.getElementById('birthdate').value;
            userData.gender = document.getElementById('gender').value;
            userData.nationality = document.getElementById('nationality').value;
            userData.address = document.getElementById('address').value;
            userData.city = document.getElementById('city').value;
            userData.country = document.getElementById('country').value;
            userData.postalCode = document.getElementById('postalCode').value;
            userData.preferredLang = document.getElementById('preferredLang').value;
            userData.avatar = document.getElementById('avatar').value;

            // Sauvegarde dans le localStorage
            localStorage.setItem('travelms_user', JSON.stringify(userData));
            localStorage.setItem('user', JSON.stringify(userData));

            // Actualisation visuelle instantanée
            document.getElementById('userNameDisplay').textContent = userData.name;
            if (userData.avatar) {
                document.getElementById('avatarDisplay').src = userData.avatar;
            }

            // Message de succès
            alertBox.className = "p-4 rounded-2xl text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-200";
            alertBox.textContent = "✅ Votre profil a été mis à jour avec succès ! Vous pouvez maintenant réserver un voyage.";
            alertBox.classList.remove('hidden');

            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 4500);
        });

        // Déconnexion
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('travelms_user');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        });

        // Sélecteur de langue global
        const savedLang = localStorage.getItem('travelms_lang') || 'fr';
        document.getElementById('langSwitch').value = savedLang;
        document.getElementById('langSwitch').addEventListener('change', (e) => {
            localStorage.setItem('travelms_lang', e.target.value);
            window.location.reload();
        });
    </script>

</body>
</html>
