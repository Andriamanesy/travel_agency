<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMS - Mon Tableau de bord</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- NAVIGATION -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-black text-blue-600 tracking-tight">Travel<span class="text-slate-900">MS</span></a>
            
            <div class="flex items-center space-x-6">
                <!-- Sélecteur de langue -->
                <select id="langSwitch" class="bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600 cursor-pointer">
                    <option value="fr">🇫🇷 FR</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="ru">🇷🇺 RU</option>
                    <option value="it">🇮🇹 IT</option>
                    <option value="zh">🇨🇳 ZH</option>
                </select>

                <button id="logoutBtn" class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-4 py-2 rounded-xl font-medium transition text-sm">
                    Déconnexion
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL DU DASHBOARD -->
    <main class="pt-28 pb-16 max-w-5xl mx-auto px-6">
        
        <!-- En-tête de bienvenue -->
        <div class="mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <img id="avatarDisplay" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Avatar" class="w-16 h-16 rounded-full object-cover border-2 border-blue-600 shadow-md">
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-slate-900">Bonjour, <span id="userNameDisplay" class="text-blue-600">Voyageur</span> 👋</h1>
                    <p class="text-slate-500 text-sm mt-1">Complétez votre profil pour pouvoir effectuer une réservation en toute sérénité.</p>
                </div>
            </div>
            <!-- Badge dynamique -->
            <div id="profileStatusBadge" class="bg-amber-50 text-amber-700 px-4 py-2 rounded-2xl text-xs font-bold uppercase tracking-wider transition-all duration-300">
                Profil Partiel
            </div>
        </div>

        <!-- Grille des sections du Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Colonne de gauche : Navigation interne -->
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-2 h-fit">
                <a href="#profile" class="flex items-center space-x-3 px-4 py-3 rounded-2xl bg-blue-50 text-blue-600 font-semibold transition">
                    <span>👤</span> <span>Mon Profil (Niveau 2)</span>
                </a>
                <a href="#reservations" class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-slate-600 hover:bg-slate-50 font-medium transition">
                    <span>✈️</span> <span>Mes Réservations</span>
                </a>
                <a href="#security" class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-slate-600 hover:bg-slate-50 font-medium transition">
                    <span>🔒</span> <span>Sécurité</span>
                </a>
            </div>

            <!-- Colonne de droite : Formulaire étendu -->
            <div class="md:col-span-2 bg-white p-8 rounded-3xl border border-slate-100 shadow-sm space-y-6">
                <div class="border-b border-slate-100 pb-4">
                    <h2 class="text-xl font-bold text-slate-900">Informations du Profil</h2>
                    <p class="text-slate-500 text-sm">Renseignez vos informations personnelles sécurisées.</p>
                </div>

                <!-- Message d'alerte / succès -->
                <div id="alertBox" class="hidden p-4 rounded-2xl text-sm font-medium transition-all duration-300"></div>

                <!-- Formulaire -->
                <form id="profileForm" enctype="multipart/form-data" class="space-y-4">
                    <!-- Informations de base -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Nom complet</label>
                            <input type="text" id="fullName" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Adresse e-mail</label>
                            <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm transition">
                        </div>
                    </div>

                    <!-- Téléphone avec sélecteur d'indicatif et Date de naissance -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Téléphone</label>
                            <div class="flex gap-2">
                                <select id="phoneCode" class="w-1/3 px-2 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm font-semibold transition">
                                    <option value="+261">🇲🇬 +261</option>
                                    <option value="+33">🇫🇷 +33</option>
                                    <option value="+32">🇧🇪 +32</option>
                                    <option value="+41">🇨🇭 +41</option>
                                    <option value="+1">🇨🇦 +1</option>
                                    <option value="+213">🇩🇿 +213</option>
                                    <option value="+212">🇲🇦 +212</option>
                                    <option value="+216">🇹🇳 +216</option>
                                    <option value="+34">🇪🇸 +34</option>
                                    <option value="+39">🇮🇹 +39</option>
                                    <option value="+49">🇩🇪 +49</option>
                                </select>
                                <input type="text" id="phone" inputmode="numeric" placeholder="340000000" class="w-2/3 px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm transition">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Date de naissance</label>
                            <input type="date" id="birthdate" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm transition">
                        </div>
                    </div>

                    <!-- Sexe et Nationalité -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Sexe</label>
                            <select id="gender" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm transition">
                                <option value="" disabled selected>Sélectionner</option>
                                <option value="Féminin">Féminin</option>
                                <option value="Masculin">Masculin</option>
                                <option value="Autre">Autre / Non spécifié</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Nationalité</label>
                            <select id="nationality" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm transition">
                                <option value="" disabled selected>Chargement...</option>
                            </select>
                        </div>
                    </div>

                    <!-- Pays, Ville et Code postal -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Pays</label>
                            <select id="country" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm transition">
                                <option value="" disabled selected>Chargement...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Ville</label>
                            <select id="city" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm transition">
                                <option value="" disabled selected>Sélectionner d'abord un pays</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Code postal</label>
                            <input type="text" id="postalCode" placeholder="Auto" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm transition">
                        </div>
                    </div>

                    <!-- Adresse postale -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Adresse postale</label>
                        <input type="text" id="address" placeholder="Lot IVX 123 Bis..." class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm transition">
                    </div>

                    <!-- Langue préférée et Photo de profil (Type Fichier) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Langue préférée</label>
                            <select id="preferredLang" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm transition">
                                <option value="fr">Français</option>
                                <option value="en">English</option>
                                <option value="es">Español</option>
                                <option value="ru">Русский</option>
                                <option value="it">Italiano</option>
                                <option value="zh">中文</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Photo de profil (Fichier)</label>
                            <input type="file" id="avatarFile" accept="image/png, image/jpeg, image/webp" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-xs text-slate-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100 cursor-pointer transition">
                        </div>
                    </div>

                    <div class="pt-4 flex justify-end">
                        <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 disabled:cursor-not-allowed text-white font-semibold px-6 py-3 rounded-xl shadow-lg shadow-blue-600/20 transition text-sm flex items-center gap-2">
                            <span id="submitBtnText">Mettre à jour mon profil</span>
                            <span id="submitSpinner" class="hidden animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <!-- SCRIPT DE GESTION -->
    <script src="/js/config.js" defer></script>
    <script src="/js/pages/dashboard.js" defer></script>

</body>
</html>
