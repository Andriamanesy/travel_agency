<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMS - Mon Tableau de bord</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- NAVIGATION -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-black text-blue-600 tracking-tight">Travel<span class="text-slate-900">MS</span></a>
            
            <div class="flex items-center space-x-6">
                <!-- Sélecteur de langue -->
                <select id="langSwitch" class="bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600 cursor-pointer">
                    <option value="fr">🇫🇷 FR</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="ru">🇷🇺 RU</option>
                    <option value="it">🇮🇹 IT</option>
                    <option value="zh">🇨🇳 ZH</option>
                </select>

                <button id="logoutBtn" class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-4 py-2 rounded-xl font-medium transition text-sm">
                    Déconnexion
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL DU DASHBOARD -->
    <main class="pt-28 pb-16 max-w-5xl mx-auto px-6">
        
        <!-- En-tête de bienvenue -->
        <div class="mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <img id="avatarDisplay" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Avatar" class="w-16 h-16 rounded-full object-cover border-2 border-blue-600 shadow-md">
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-slate-900">Bonjour, <span id="userNameDisplay" class="text-blue-600">Voyageur</span> 👋</h1>
                    <p class="text-slate-500 text-sm mt-1">Complétez votre profil pour pouvoir effectuer une réservation en toute sérénité.</p>
                </div>
            </div>
            <!-- Badge dynamique -->
            <div id="profileStatusBadge" class="bg-amber-50 text-amber-700 px-4 py-2 rounded-2xl text-xs font-bold uppercase tracking-wider transition-all duration-300">
                Profil Partiel
            </div>
        </div>

        <!-- Grille des sections du Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Colonne de gauche : Navigation interne -->
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-2 h-fit">
                <a href="#profile" class="flex items-center space-x-3 px-4 py-3 rounded-2xl bg-blue-50 text-blue-600 font-semibold transition">
                    <span>👤</span> <span>Mon Profil (Niveau 2)</span>
                </a>
                <a href="#reservations" class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-slate-600 hover:bg-slate-50 font-medium transition">
                    <span>✈️</span> <span>Mes Réservations</span>
                </a>
                <a href="#security" class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-slate-600 hover:bg-slate-50 font-medium transition">
                    <span>🔒</span> <span>Sécurité</span>
                </a>
            </div>

            <!-- Colonne de droite : Formulaire étendu -->
            <div class="md:col-span-2 bg-white p-8 rounded-3xl border border-slate-100 shadow-sm space-y-6">
                <div class="border-b border-slate-100 pb-4">
                    <h2 class="text-xl font-bold text-slate-900">Informations du Profil</h2>
                    <p class="text-slate-500 text-sm">Renseignez vos informations personnelles sécurisées.</p>
                </div>

                <!-- Message d'alerte / succès -->
                <div id="alertBox" class="hidden p-4 rounded-2xl text-sm font-medium"></div>

                <form id="profileForm" class="space-y-4">
                    <!-- Informations de base -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Nom complet</label>
                            <input type="text" id="fullName" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Adresse e-mail</label>
                            <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                    </div>

                    <!-- Téléphone avec sélecteur d'indicatif et Date de naissance -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Téléphone</label>
                            <div class="flex gap-2">
                                <select id="phoneCode" class="w-1/3 px-2 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm font-semibold">
                                    <option value="+261">🇲🇬 +261</option>
                                    <option value="+33">🇫🇷 +33</option>
                                    <option value="+32">🇧🇪 +32</option>
                                    <option value="+41">🇨🇭 +41</option>
                                    <option value="+1">🇨🇦 +1</option>
                                    <option value="+213">🇩🇿 +213</option>
                                    <option value="+212">🇲🇦 +212</option>
                                    <option value="+216">🇹🇳 +216</option>
                                    <option value="+34">🇪🇸 +34</option>
                                    <option value="+39">🇮🇹 +39</option>
                                    <option value="+49">🇩🇪 +49</option>
                                </select>
                                <input type="text" id="phone" inputmode="numeric" placeholder="340000000" class="w-2/3 px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Date de naissance</label>
                            <input type="date" id="birthdate" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                    </div>

                    <!-- Sexe et Nationalité -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Sexe</label>
                            <select id="gender" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                                <option value="" disabled selected>Sélectionner</option>
                                <option value="Féminin">Féminin</option>
                                <option value="Masculin">Masculin</option>
                                <option value="Autre">Autre / Non spécifié</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Nationalité</label>
                            <select id="nationality" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                                <option value="" disabled selected>Chargement...</option>
                            </select>
                        </div>
                    </div>

                    <!-- Pays, Ville et Code postal -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Pays</label>
                            <select id="country" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                                <option value="" disabled selected>Chargement...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Ville</label>
                            <select id="city" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                                <option value="" disabled selected>Sélectionner d'abord un pays</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Code postal</label>
                            <input type="text" id="postalCode" placeholder="Auto" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                    </div>

                    <!-- Adresse postale -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Adresse postale</label>
                        <input type="text" id="address" placeholder="Lot IVX 123 Bis..." class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                    </div>

                    <!-- Langue préférée et Photo de profil -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Langue préférée</label>
                            <select id="preferredLang" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                                <option value="fr">Français</option>
                                <option value="en">English</option>
                                <option value="es">Español</option>
                                <option value="ru">Русский</option>
                                <option value="it">Italiano</option>
                                <option value="zh">中文</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2">URL de la photo de profil</label>
                            <input type="url" id="avatar" placeholder="https://exemple.com/photo.jpg" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                        </div>
                    </div>

                    <div class="pt-4 flex justify-end">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl shadow-lg shadow-blue-600/20 transition text-sm">
                            Mettre à jour mon profil
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <!-- SCRIPT DE GESTION -->
    <script>
        const token = localStorage.getItem('token');
        let userData = JSON.parse(localStorage.getItem('travelms_user') || localStorage.getItem('user') || '{}');

        if (!token && !userData.email) {
            window.location.href = 'login.html';
        }

        // Fonction pour vérifier et mettre à jour dynamiquement l'état du profil
        function checkProfileCompletion() {
            const badge = document.getElementById('profileStatusBadge');
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const country = document.getElementById('country').value;
            const city = document.getElementById('city').value;
            const birthdate = document.getElementById('birthdate').value;

            // Critère de profil complet : Nom, email, téléphone, pays, ville et date de naissance remplis
            if (fullName && email && phone && country && city && birthdate) {
                badge.className = "bg-emerald-50 text-emerald-700 px-4 py-2 rounded-2xl text-xs font-bold uppercase tracking-wider transition-all duration-300";
                badge.textContent = "Profil Complet";
            } else {
                badge.className = "bg-amber-50 text-amber-700 px-4 py-2 rounded-2xl text-xs font-bold uppercase tracking-wider transition-all duration-300";
                badge.textContent = "Profil Partiel";
            }
        }

        // Bloquer tout caractère autre que des chiffres dans le téléphone
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            checkProfileCompletion();
        });

        // Villes par pays
        const citiesByCountry = {
            "Madagascar": ["Antananarivo", "Toamasina", "Antsirabe", "Fianarantsoa", "Mahajanga", "Toliara", "Antsiranana", "Nosy Be"],
            "France": ["Paris", "Lyon", "Marseille", "Toulouse", "Nice", "Nantes", "Strasbourg", "Montpellier", "Bordeaux", "Lille"],
            "Belgique": ["Bruxelles", "Anvers", "Gand", "Charleroi", "Liège", "Bruges"],
            "Suisse": ["Genève", "Zurich", "Lausanne", "Berne", "Bâle"],
            "Canada": ["Montréal", "Toronto", "Québec", "Vancouver", "Ottawa"],
            "États-Unis": ["New York", "Los Angeles", "Chicago", "Miami", "San Francisco"],
            "Algérie": ["Alger", "Oran", "Constantine", "Annaba"],
            "Maroc": ["Casablanca", "Rabat", "Marrakech", "Fès", "Tanger"],
            "Tunisie": ["Tunis", "Sfax", "Sousse", "Bizerte"],
            "Espagne": ["Madrid", "Barcelone", "Valence", "Séville"],
            "Italie": ["Rome", "Milan", "Naples", "Turin", "Florence"],
            "Allemagne": ["Berlin", "Hambourg", "Munich", "Francfort"]
        };

        const postalCodesByCity = {
            "Antananarivo": "101", "Toamasina": "501", "Antsirabe": "110", "Fianarantsoa": "301", 
            "Mahajanga": "401", "Toliara": "601", "Antsiranana": "201", "Nosy Be": "207",
            "Paris": "75001", "Lyon": "69001", "Marseille": "13001", "Toulouse": "31000", 
            "Nice": "06000", "Nantes": "44000", "Strasbourg": "67000", "Montpellier": "34000", 
            "Bordeaux": "33000", "Lille": "59000", "Bruxelles": "1000", "Anvers": "2000", 
            "Genève": "1201", "Zurich": "8001", "Lausanne": "1000", "Montréal": "H3A 0G4", 
            "Toronto": "M5V 2H1", "New York": "10001", "Alger": "16000", "Oran": "31000", 
            "Casablanca": "20000", "Rabat": "10000", "Tunis": "1000", "Madrid": "28001", 
            "Barcelone": "08001", "Rome": "00100", "Milan": "20121", "Berlin": "10115", "Munich": "80331"
        };

        function updateCities(selectedCountry, preselectedCity = '') {
            const citySelect = document.getElementById('city');
            citySelect.innerHTML = '<option value="" disabled selected>Sélectionner la ville</option>';
            const cities = citiesByCountry[selectedCountry] || ["Autre / Saisie libre"];

            cities.forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                if (preselectedCity && preselectedCity === city) {
                    option.selected = true;
                }
                citySelect.appendChild(option);
            });
            checkProfileCompletion();
        }

        document.getElementById('city').addEventListener('change', (e) => {
            const selectedCity = e.target.value;
            const postalInput = document.getElementById('postalCode');
            if (postalCodesByCity[selectedCity]) {
                postalInput.value = postalCodesByCity[selectedCity];
            }
            checkProfileCompletion();
        });

        async function loadCountries() {
            const countrySelect = document.getElementById('country');
            const fallbackCountries = Object.keys(citiesByCountry).sort();

            try {
                const response = await fetch('https://restcountries.com/v3.1/all?fields=name,translations');
                if (!response.ok) throw new Error('Erreur réseau');
                const countries = await response.json();

                countries.sort((a, b) => {
                    const nameA = a.translations?.fra?.common || a.name.common;
                    const nameB = b.translations?.fra?.common || b.name.common;
                    return nameA.localeCompare(nameB);
                });

                countrySelect.innerHTML = '<option value="" disabled selected>Sélectionner le pays</option>';
                countries.forEach(country => {
                    const frenchName = country.translations?.fra?.common || country.name.common;
                    const option = document.createElement('option');
                    option.value = frenchName;
                    option.textContent = frenchName;
                    if (userData.country === frenchName) option.selected = true;
                    countrySelect.appendChild(option);
                });
            } catch (error) {
                console.warn("Utilisation de la liste de secours pour les pays.");
                countrySelect.innerHTML = '<option value="" disabled selected>Sélectionner le pays</option>';
                fallbackCountries.forEach(country => {
                    const option = document.createElement('option');
                    option.value = country;
                    option.textContent = country;
                    if (userData.country === country) option.selected = true;
                    countrySelect.appendChild(option);
                });
            }

            if (userData.country) {
                updateCities(userData.country, userData.city);
            }
            checkProfileCompletion();
        }

        document.getElementById('country').addEventListener('change', (e) => {
            updateCities(e.target.value);
            document.getElementById('postalCode').value = '';
            checkProfileCompletion();
        });

        function loadNationalities() {
            const natSelect = document.getElementById('nationality');
            const nationalities = [
                "Malgache", "Française", "Belge", "Suisse", "Canadienne", "Américaine", 
                "Algérienne", "Allemande", "Britannique", "Espagnole", "Italienne", 
                "Marocaine", "Tunisienne", "Sénégalaise", "Portugaise", "Autre"
            ].sort();

            natSelect.innerHTML = '<option value="" disabled selected>Sélectionner la nationalité</option>';
            nationalities.forEach(nat => {
                const option = document.createElement('option');
                option.value = nat;
                option.textContent = nat;
                if (userData.nationality === nat) option.selected = true;
                natSelect.appendChild(option);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCountries();
            loadNationalities();
            
            // Pré-remplissage des champs de base
            document.getElementById('fullName').value = userData.name || userData.fullName || '';
            document.getElementById('email').value = userData.email || '';
            
            if (userData.phone) {
                const parts = userData.phone.trim().split(' ');
                if (parts.length >= 2 && parts[0].startsWith('+')) {
                    document.getElementById('phoneCode').value = parts[0];
                    document.getElementById('phone').value = parts.slice(1).join('').replace(/\D/g, '');
                } else {
                    document.getElementById('phone').value = userData.phone.replace(/\D/g, '');
                }
            }

            document.getElementById('birthdate').value = userData.birthdate || '';
            document.getElementById('gender').value = userData.gender || '';
            document.getElementById('postalCode').value = userData.postalCode || '';
            document.getElementById('address').value = userData.address || '';
            document.getElementById('preferredLang').value = userData.preferredLang || 'fr';
            document.getElementById('avatar').value = userData.avatar || '';

            document.getElementById('userNameDisplay').textContent = userData.name || userData.fullName || 'Voyageur';
            if (userData.avatar) {
                document.getElementById('avatarDisplay').src = userData.avatar;
            }

            // Vérification initiale du statut
            checkProfileCompletion();
        });

        // Écouter les modifications sur tous les champs texte/date pour mettre à jour en direct le badge
        ['fullName', 'email', 'birthdate', 'postalCode', 'address', 'gender', 'nationality', 'preferredLang', 'avatar'].forEach(id => {
            document.getElementById(id).addEventListener('input', checkProfileCompletion);
            document.getElementById(id).addEventListener('change', checkProfileCompletion);
        });

        const profileForm = document.getElementById('profileForm');
        const alertBox = document.getElementById('alertBox');

        function showAlert(message, type = 'rose') {
            if (type === 'rose') {
                alertBox.className = "p-4 rounded-2xl text-sm font-medium bg-rose-50 text-rose-700 border border-rose-200";
            } else {
                alertBox.className = "p-4 rounded-2xl text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-200";
            }
            alertBox.textContent = message;
            alertBox.classList.remove('hidden');
        }

        profileForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const phoneCode = document.getElementById('phoneCode').value;
            const phoneNum = phoneInput.value.trim();
            if (phoneNum && !/^\d{6,12}$/.test(phoneNum)) {
                showAlert("⚠️ Le numéro de téléphone doit contenir uniquement des chiffres (entre 6 et 12 chiffres).");
                return;
            }

            const cityInput = document.getElementById('city').value;
            if (!cityInput) {
                showAlert("⚠️ Veuillez sélectionner une ville.");
                return;
            }

            const postalInput = document.getElementById('postalCode').value.trim();
            const postalRegex = /^[a-zA-Z0-9\s\-]{2,10}$/;
            if (postalInput && !postalRegex.test(postalInput)) {
                showAlert("⚠️ Veuillez entrer un code postal valide.");
                return;
            }

            userData.name = document.getElementById('fullName').value;
            userData.fullName = userData.name;
            userData.email = document.getElementById('email').value;
            userData.phone = phoneNum ? `${phoneCode} ${phoneNum}` : '';
            userData.birthdate = document.getElementById('birthdate').value;
            userData.gender = document.getElementById('gender').value;
            userData.nationality = document.getElementById('nationality').value;
            userData.country = document.getElementById('country').value;
            userData.city = cityInput;
            userData.postalCode = postalInput;
            userData.address = document.getElementById('address').value;
            userData.preferredLang = document.getElementById('preferredLang').value;
            userData.avatar = document.getElementById('avatar').value;

            localStorage.setItem('travelms_user', JSON.stringify(userData));
            localStorage.setItem('user', JSON.stringify(userData));

            document.getElementById('userNameDisplay').textContent = userData.name;
            if (userData.avatar) {
                document.getElementById('avatarDisplay').src = userData.avatar;
            }

            // Mettre à jour le badge après sauvegarde
            checkProfileCompletion();

            showAlert("✅ Votre profil a été mis à jour avec succès !", "emerald");

            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 4500);
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('travelms_user');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        });

        const savedLang = localStorage.getItem('travelms_lang') || 'fr';
        document.getElementById('langSwitch').value = savedLang;
        document.getElementById('langSwitch').addEventListener('change', (e) => {
            localStorage.setItem('travelms_lang', e.target.value);
            window.location.reload();
        });
    </script>

</body>
</html>
