<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails de la destination - TravelMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="text-2xl font-black text-blue-600 tracking-tight">Travel<span class="text-slate-900">MS</span></a>
            <nav class="flex items-center gap-4 text-sm text-slate-700">
                <a href="/" class="hover:text-blue-600 transition">Accueil</a>
                <a href="/register.html" class="hover:text-blue-600 transition">Inscription</a>
                <a href="/login.html" class="hover:text-blue-600 transition">Connexion</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <div id="destination-loading" class="text-center py-24 text-slate-500">Chargement de la destination...</div>
        <div id="destination-error" class="hidden rounded-3xl border border-rose-200 bg-rose-50 text-rose-700 px-6 py-8 text-center"></div>

        <section id="destination-content" class="hidden space-y-8">
            <div class="relative overflow-hidden rounded-[2rem] shadow-xl bg-slate-200">
                <img id="destinationHero" src="" alt="" class="w-full h-[520px] object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-transparent"></div>
                <div class="absolute bottom-8 left-8 text-white max-w-2xl">
                    <p id="destinationLocation" class="text-sm uppercase tracking-[0.35em] font-semibold text-blue-200"></p>
                    <h1 id="destinationTitle" class="mt-4 text-4xl md:text-5xl font-black leading-tight"></h1>
                    <p id="destinationLead" class="mt-4 text-base md:text-lg text-slate-100 max-w-3xl"></p>
                </div>
            </div>

            <div class="grid gap-10 xl:grid-cols-[1.5fr_0.9fr]">
                <div class="space-y-10">
                    <div class="rounded-[2rem] bg-white p-8 shadow-sm">
                        <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
                            <div>
                                <p class="text-xs uppercase tracking-[0.35em] text-slate-400 font-semibold">Détails de la destination</p>
                                <h2 class="mt-3 text-3xl font-extrabold text-slate-900">À propos de ce séjour</h2>
                            </div>
                            <div class="rounded-3xl bg-slate-100 px-5 py-4 text-slate-700 shadow-sm">
                                <p class="text-sm text-slate-500">Prix</p>
                                <p id="destinationPrice" class="mt-2 text-2xl font-black text-slate-900"></p>
                            </div>
                        </div>
                        <p id="destinationDescription" class="mt-8 text-slate-600 leading-8"></p>
                    </div>

                    <div class="rounded-[2rem] bg-white p-8 shadow-sm">
                        <h3 class="text-2xl font-bold text-slate-900">Galerie photo</h3>
                        <p class="mt-3 text-slate-500">Cliquez sur une miniature pour agrandir l'image.</p>
                        <div id="galleryGrid" class="mt-6 grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
                    </div>
                </div>

                <aside class="space-y-6 rounded-[2rem] border border-slate-200 bg-white p-8 shadow-sm">
                    <div class="space-y-3">
                        <div class="text-sm uppercase tracking-[0.35em] text-slate-500 font-semibold">Informations</div>
                        <div class="grid gap-4">
                            <div class="flex items-center justify-between rounded-3xl bg-slate-50 px-4 py-4">
                                <span class="text-slate-600">Lieu</span>
                                <span id="destinationLocationDetail" class="font-semibold text-slate-900"></span>
                            </div>
                            <div class="flex items-center justify-between rounded-3xl bg-slate-50 px-4 py-4">
                                <span class="text-slate-600">Statut</span>
                                <span id="destinationStatus" class="font-semibold text-emerald-700">Disponible</span>
                            </div>
                        </div>
                    </div>
                    <a href="/register.html" class="block w-full text-center bg-blue-600 text-white py-4 rounded-3xl font-semibold hover:bg-blue-700 transition">Réserver maintenant</a>
                </aside>
            </div>
        </section>
    </main>

    <div id="lightbox" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 p-6">
        <button id="lightboxClose" type="button" aria-label="Fermer l'image agrandie" class="absolute top-6 right-6 text-white text-3xl font-bold">×</button>
        <img id="lightboxImage" src="" alt="Agrandissement de l'image" class="max-h-full max-w-full rounded-3xl shadow-2xl" />
    </div>

    <script type="module" src="/js/pages/destination-detail.js"></script>
</body>
</html>
