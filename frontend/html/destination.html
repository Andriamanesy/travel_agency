<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination - TravelMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="text-2xl font-black text-blue-600 tracking-tight">Travel<span class="text-slate-900">MS</span></a>
            <nav class="flex items-center gap-4 text-sm text-slate-700">
                <a href="/" class="hover:text-blue-600 transition">Accueil</a>
                <a href="/register.html" class="hover:text-blue-600 transition">Inscription</a>
                <a href="/login.html" class="hover:text-blue-600 transition">Connexion</a>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <div id="destination-loading" class="text-center py-24 text-slate-500">Chargement de la destination...</div>
        <div id="destination-error" class="hidden rounded-3xl border border-rose-200 bg-rose-50 text-rose-700 px-6 py-8 text-center"></div>

        <article id="destination-content" class="hidden bg-white rounded-3xl shadow-sm overflow-hidden">
            <div class="relative h-[420px] bg-slate-200">
                <img id="destinationHero" src="" alt="" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/10 to-transparent"></div>
                <div class="absolute bottom-6 left-6 text-white max-w-xl">
                    <p id="destinationLocation" class="text-sm uppercase tracking-[0.3em] font-semibold text-blue-200"></p>
                    <h1 id="destinationTitle" class="mt-3 text-4xl md:text-5xl font-black leading-tight"></h1>
                    <p id="destinationLead" class="mt-4 text-base text-slate-100 max-w-2xl"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-[1.3fr_0.7fr] gap-10 p-8">
                <section class="space-y-8">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">À propos</h2>
                        <p id="destinationDescription" class="mt-4 text-slate-600 leading-relaxed"></p>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">Points forts</h2>
                        <ul id="destinationHighlights" class="mt-4 space-y-3 text-slate-600 list-disc list-inside"></ul>
                    </div>
                </section>

                <aside class="space-y-6 rounded-3xl border border-slate-200 bg-slate-50 p-6 shadow-sm">
                    <div class="space-y-3">
                        <div class="text-sm uppercase tracking-[0.3em] text-slate-500 font-semibold">Détails</div>
                        <div class="flex items-center justify-between py-3 border-b border-slate-200">
                            <span class="text-slate-600">Lieu</span>
                            <span id="destinationLocationDetail" class="font-semibold text-slate-900"></span>
                        </div>
                        <div class="flex items-center justify-between py-3 border-b border-slate-200">
                            <span class="text-slate-600">Prix</span>
                            <span id="destinationPrice" class="font-semibold text-slate-900"></span>
                        </div>
                        <div class="flex items-center justify-between py-3">
                            <span class="text-slate-600">Statut</span>
                            <span id="destinationStatus" class="font-semibold text-emerald-700">Disponible</span>
                        </div>
                    </div>
                    <a href="/register.html" class="block w-full text-center bg-blue-600 text-white py-3 rounded-2xl font-semibold hover:bg-blue-700 transition">Réserver maintenant</a>
                </aside>
            </div>
        </article>
    </main>

    <script type="module" src="/js/pages/destination.js"></script>
</body>
</html>
