<!DOCTYPE html>

</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-slate-50 via-slate-100 to-slate-200 text-slate-800 font-sans">

    <!-- En-tête -->

        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">

            <nav class="hidden md:flex space-x-8 font-medium text-slate-600">

                <a href="/#destinations" class="hover:text-blue-600 transition" data-i18n="nav.destinations">Destinations</a>
                <a href="/#circuits" class="hover:text-blue-600 transition" data-i18n="nav.circuits">Circuits</a>
            </nav>
            <div class="flex items-center space-x-4">
                <!-- Sélecteur de langue -->
                <select id="langSwitch" class="bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600 cursor-pointer">
                    <option value="fr">🇫🇷 FR</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="ru">🇷🇺 RU</option>
                    <option value="it">🇮🇹 IT</option>
                    <option value="zh">🇨🇳 ZH</option>
                </select>

                <a href="/login.html" class="px-5 py-2.5 rounded-full font-medium text-slate-700 hover:text-blue-600 transition" data-i18n="nav.login">Connexion</a>
                <a href="/register.html" class="bg-blue-600 text-white px-5 py-2.5 rounded-full font-bold shadow-lg shadow-blue-600/20 hover:bg-blue-700 transition" data-i18n="nav.register">Inscription</a>
            </div>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="flex-1 flex items-center justify-center px-4 py-28">
        <div class="bg-white p-8 md:p-10 rounded-3xl border border-slate-100 shadow-xl w-full max-w-md">
            
            <div class="text-center mb-8">
                <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2" data-i18n="forgot.title">Mot de passe oublié ?</h2>
                <p class="text-slate-500 text-sm leading-relaxed" data-i18n="forgot.subtitle">Entrez votre email pour recevoir les instructions de réinitialisation.</p>
            </div>

            <form id="forgot-form" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="forgot.email_label">Adresse email</label>
                    <input type="email" id="email" name="email" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" data-i18n-placeholder="forgot.email_placeholder" placeholder="jean.dupont@exemple.com" required autocomplete="email">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-600/20 transition duration-200 mt-2" data-i18n="forgot.submit">Envoyer le lien</button>
            </form>

            <div class="text-center text-sm text-slate-500 mt-6">
                <a href="/login.html" class="text-blue-600 font-semibold hover:underline inline-flex items-center space-x-1">
                    <span>←</span>
                    <span data-i18n="forgot.back">Retour à la connexion</span>
                </a>
            </div>

        </div>
    </main>

    <!-- Pied de page -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center text-sm mt-auto">
        <p>&copy; <span id="current-year"></span> TravelMS. <span data-i18n="footer.rights">Tous droits réservés.</span></p>
    </footer>

    <!-- Script de gestion (Multi-langue, Toast, API) -->

        // CONFIGURATION CENTRALE DE L'API
        const API_BASE_URL = `http://${window.location.hostname}:3000`;

        document.getElementById('current-year').textContent = new Date().getFullYear();

            es: {
                "nav.home": "Inicio",
                "nav.destinations": "Destinos",
                "nav.circuits": "Circuitos",
                "nav.login": "Iniciar sesión",
                "nav.register": "Registrarse",
                "forgot.title": "¿Contraseña olvidada?",
                "forgot.subtitle": "Introduce tu correo electrónico para recibir las instrucciones de restablecimiento.",
                "forgot.email_label": "Correo electrónico",

                "forgot.sending": "Invio in corso...",
                "forgot.sent": "Link inviato",
                "forgot.back": "Torna al login",

                "forgot.error_default": "Si è verificato un errore.",

            },
            zh: {
                "nav.home": "首页",
                "nav.destinations": "目的地",
                "nav.circuits": "旅游线路",

                "nav.register": "注册",
                "forgot.title": "忘记密码？",

                "forgot.email_label": "电子邮箱",

                "forgot.sending": "正在发送...",
                "forgot.sent": "链接已发送",

                "forgot.error_default": "发生错误。",
                "footer.rights": "保留所有权利。"
            }
        };

        function setLanguage(lang) {
            localStorage.setItem('travelms_lang', lang);
            document.documentElement.setAttribute('lang', lang);

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    el.setAttribute('placeholder', translations[lang][key]);
                }
            });

            const select = document.getElementById('langSwitch');
            if (select) select.value = lang;
        }

        const savedLang = localStorage.getItem('travelms_lang') || 'fr';
        setLanguage(savedLang);

        document.getElementById('langSwitch').addEventListener('change', (e) => {
            setLanguage(e.target.value);
        });

        // Fonction Toast pour les notifications élégantes
        function showToast(message, type = 'success') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'fixed top-5 right-5 z-50 flex flex-col space-y-3';
                document.body.appendChild(container);
            }
            
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : 'bg-rose-600';
            
            toast.className = `${bgClass} text-white px-6 py-3.5 rounded-2xl shadow-xl flex items-center space-x-3 transition-all transform translate-y-2 opacity-0 duration-300 font-medium text-sm`;
            
            const icon = type === 'success' ? '✅' : '⚠️';
            toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const currentLang = localStorage.getItem('travelms_lang') || 'fr';

            submitBtn.textContent = translations[currentLang]["forgot.sending"];
            submitBtn.disabled = true;

            try {
                // Utilisation de API_BASE_URL pour pointer correctement vers le backend (ex: port 3000)
                const response = await fetch(`${API_BASE_URL}/api/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || data.message || translations[currentLang]["forgot.error_default"]);
                }

                showToast(data.message || translations[currentLang]["forgot.success_default"], "success");
                submitBtn.textContent = translations[currentLang]["forgot.sent"];

                setTimeout(() => {
                    submitBtn.textContent = translations[currentLang]["forgot.submit"];
                    submitBtn.disabled = false;
                }, 4000);

            } catch (err) {
                showToast(err.message, "error");
                submitBtn.textContent = translations[currentLang]["forgot.submit"];
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
