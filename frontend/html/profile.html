<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil — TravelMS</title>
    <link rel="icon" href="/assets/favicon.ico">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-slate-50 via-slate-100 to-slate-200 text-slate-800 font-sans">

    <!-- En-tête fixe -->
    <header class="bg-white/85 backdrop-blur-md shadow-sm fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="text-2xl font-black text-blue-600 tracking-tight no-underline">Travel<span class="text-slate-900">MS</span></a>
            <nav class="hidden md:flex space-x-8 font-medium text-slate-600">
                <a href="/" class="hover:text-blue-600 transition" data-i18n="nav.home">Accueil</a>
                <a href="/#destinations" class="hover:text-blue-600 transition" data-i18n="nav.destinations">Destinations</a>
                <a href="/#circuits" class="hover:text-blue-600 transition" data-i18n="nav.circuits">Circuits</a>
            </nav>
            <div class="flex items-center space-x-4">
                <!-- Sélecteur de langue -->
                <select id="langSwitch" class="bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600 cursor-pointer">
                    <option value="fr">🇫🇷 FR</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="ru">🇷🇺 RU</option>
                    <option value="it">🇮🇹 IT</option>
                    <option value="zh">🇨🇳 ZH</option>
                </select>

                <button id="logoutBtn" class="bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200 px-4 py-2 rounded-xl text-sm font-semibold transition" data-i18n="nav.logout">Déconnexion</button>
            </div>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="flex-1 flex items-center justify-center px-4 py-28">
        <div class="bg-white p-8 md:p-10 rounded-3xl border border-slate-100 shadow-xl w-full max-w-lg">
            
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-3xl font-bold mx-auto mb-4" id="user-avatar">
                    👤
                </div>
                <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2" data-i18n="profile.title">Mon Profil</h2>
                <p class="text-slate-500 text-sm leading-relaxed" data-i18n="profile.subtitle">Consultez et mettez à jour vos informations personnelles.</p>
            </div>

            <form id="profile-form" class="space-y-5">
                <div>
                    <label for="name" class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="profile.name_label">Nom complet</label>
                    <input type="text" id="name" name="name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" required>
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="profile.email_label">Adresse email</label>
                    <input type="email" id="email" name="email" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" required autocomplete="email">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-600/20 transition duration-200 mt-2" data-i18n="profile.submit">Mettre à jour</button>
            </form>

            <div class="text-center text-sm text-slate-500 mt-6">
                <a href="/" class="text-blue-600 font-semibold hover:underline inline-flex items-center space-x-1">
                    <span>←</span>
                    <span data-i18n="profile.back">Retour à l'accueil</span>
                </a>
            </div>

        </div>
    </main>

    <!-- Pied de page -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center text-sm mt-auto">
        <p>&copy; <span id="current-year"></span> TravelMS. <span data-i18n="footer.rights">Tous droits réservés.</span></p>
    </footer>

    <!-- Script de gestion (Multi-langue, Toast, API Profile) -->
    <script>
        // URL de base dynamique pour pointer vers le backend Node.js sur le port 3000
        const API_BASE_URL = `http://${window.location.hostname}:3000`;

        document.getElementById('current-year').textContent = new Date().getFullYear();

        const translations = {
            fr: {
                "nav.home": "Accueil",
                "nav.destinations": "Destinations",
                "nav.circuits": "Circuits",
                "nav.logout": "Déconnexion",
                "profile.title": "Mon Profil",
                "profile.subtitle": "Consultez et mettez à jour vos informations personnelles.",
                "profile.name_label": "Nom complet",
                "profile.email_label": "Adresse email",
                "profile.submit": "Mettre à jour",
                "profile.updating": "Mise à jour...",
                "profile.success": "Profil mis à jour avec succès !",
                "profile.error": "Erreur lors de la mise à jour.",
                "profile.load_error": "Impossible de charger le profil.",
                "profile.back": "Retour à l'accueil",
                "footer.rights": "Tous droits réservés."
            },
            en: {
                "nav.home": "Home",
                "nav.destinations": "Destinations",
                "nav.circuits": "Tours",
                "nav.logout": "Sign Out",
                "profile.title": "My Profile",
                "profile.subtitle": "View and update your personal information.",
                "profile.name_label": "Full name",
                "profile.email_label": "Email address",
                "profile.submit": "Update profile",
                "profile.updating": "Updating...",
                "profile.success": "Profile successfully updated!",
                "profile.error": "Error updating profile.",
                "profile.load_error": "Could not load profile.",
                "profile.back": "Back to home",
                "footer.rights": "All rights reserved."
            },
            es: {
                "nav.home": "Inicio",
                "nav.destinations": "Destinos",
                "nav.circuits": "Circuitos",
                "nav.logout": "Cerrar sesión",
                "profile.title": "Mi Perfil",
                "profile.subtitle": "Consulta y actualiza tu información personal.",
                "profile.name_label": "Nombre completo",
                "profile.email_label": "Correo electrónico",
                "profile.submit": "Actualizar perfil",
                "profile.updating": "Actualizando...",
                "profile.success": "¡Perfil actualizado con éxito!",
                "profile.error": "Error al actualizar el perfil.",
                "profile.load_error": "No se pudo cargar el perfil.",
                "profile.back": "Volver al inicio",
                "footer.rights": "Todos los derechos reservados."
            },
            ru: {
                "nav.home": "Главная",
                "nav.destinations": "Направления",
                "nav.circuits": "Туры",
                "nav.logout": "Выйти",
                "profile.title": "Мой профиль",
                "profile.subtitle": "Просматривайте и обновляйте свою личную информацию.",
                "profile.name_label": "Полное имя",
                "profile.email_label": "Электронная почта",
                "profile.submit": "Обновить профиль",
                "profile.updating": "Обновление...",
                "profile.success": "Профиль успешно обновлен!",
                "profile.error": "Ошибка при обновлении профиля.",
                "profile.load_error": "Не удалось загрузить профиль.",
                "profile.back": "На главную",
                "footer.rights": "Все права защищены."
            },
            it: {
                "nav.home": "Home",
                "nav.destinations": "Destinazioni",
                "nav.circuits": "Tour",
                "nav.logout": "Esci",
                "profile.title": "Il mio profilo",
                "profile.subtitle": "Visualizza e aggiorna le tue informazioni personali.",
                "profile.name_label": "Nome completo",
                "profile.email_label": "Indirizzo email",
                "profile.submit": "Aggiorna profilo",
                "profile.updating": "Aggiornamento...",
                "profile.success": "Profilo aggiornato con successo!",
                "profile.error": "Errore durante l'aggiornamento.",
                "profile.load_error": "Impossibile caricare il profilo.",
                "profile.back": "Torna alla home",
                "footer.rights": "Tutti i diritti riservati."
            },
            zh: {
                "nav.home": "首页",
                "nav.destinations": "目的地",
                "nav.circuits": "旅游线路",
                "nav.logout": "退出登录",
                "profile.title": "我的个人资料",
                "profile.subtitle": "查看并更新您的个人信息。",
                "profile.name_label": "全名",
                "profile.email_label": "电子邮箱",
                "profile.submit": "更新资料",
                "profile.updating": "更新中...",
                "profile.success": "个人资料更新成功！",
                "profile.error": "更新时发生错误。",
                "profile.load_error": "无法加载个人资料。",
                "profile.back": "返回首页",
                "footer.rights": "保留所有权利。"
            }
        };

        function setLanguage(lang) {
            localStorage.setItem('travelms_lang', lang);
            document.documentElement.setAttribute('lang', lang);

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            const select = document.getElementById('langSwitch');
            if (select) select.value = lang;
        }

        const savedLang = localStorage.getItem('travelms_lang') || 'fr';
        setLanguage(savedLang);

        document.getElementById('langSwitch').addEventListener('change', (e) => {
            setLanguage(e.target.value);
        });

        // Fonction Toast pour les notifications
        function showToast(message, type = 'success') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'fixed top-5 right-5 z-50 flex flex-col space-y-3';
                document.body.appendChild(container);
            }
            
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : 'bg-rose-600';
            
            toast.className = `${bgClass} text-white px-6 py-3.5 rounded-2xl shadow-xl flex items-center space-x-3 transition-all transform translate-y-2 opacity-0 duration-300 font-medium text-sm`;
            
            const icon = type === 'success' ? '✅' : '⚠️';
            toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Charger les données du profil au chargement de la page
        window.addEventListener('DOMContentLoaded', async () => {
            const currentLang = localStorage.getItem('travelms_lang') || 'fr';
            const token = localStorage.getItem('travelms_token'); // Suppose un token JWT stocké

            try {
                const response = await fetch(`${API_BASE_URL}/api/profile`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(translations[currentLang]["profile.load_error"]);
                }

                const data = await response.json();
                document.getElementById('name').value = data.name || '';
                document.getElementById('email').value = data.email || '';
            } catch (err) {
                showToast(err.message, "error");
            }
        });

        // Soumission du formulaire de mise à jour du profil
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const currentLang = localStorage.getItem('travelms_lang') || 'fr';
            const token = localStorage.getItem('travelms_token');

            submitBtn.textContent = translations[currentLang]["profile.updating"];
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/api/profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name, email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || translations[currentLang]["profile.error"]);
                }

                showToast(translations[currentLang]["profile.success"], "success");
            } catch (err) {
                showToast(err.message, "error");
            } finally {
                submitBtn.textContent = translations[currentLang]["profile.submit"];
                submitBtn.disabled = false;
            }
        });

        // Gestion de la déconnexion
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('travelms_token');
            window.location.href = '/login.html';
        });
    </script>
</body>
</html>
