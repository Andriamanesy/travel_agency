<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — TravelMS</title>
    <link rel="icon" href="/assets/favicon.ico">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-slate-50 via-slate-100 to-slate-200 text-slate-800 font-sans">

    <!-- En-tête -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="text-2xl font-black text-blue-600 tracking-tight no-underline">Travel<span class="text-slate-900">MS</span></a>
            <nav class="hidden md:flex space-x-8 font-medium text-slate-600">
                <a href="/" class="hover:text-blue-600 transition" data-i18n="nav.home">Accueil</a>
                <a href="/#destinations" class="hover:text-blue-600 transition" data-i18n="nav.destinations">Destinations</a>
                <a href="/#circuits" class="hover:text-blue-600 transition" data-i18n="nav.circuits">Circuits</a>
            </nav>
            <div class="flex items-center space-x-4">
                <!-- Sélecteur de langue -->
                <select id="langSwitch" class="bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600 cursor-pointer">
                    <option value="fr">🇫🇷 FR</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="ru">🇷🇺 RU</option>
                    <option value="it">🇮🇹 IT</option>
                    <option value="zh">🇨🇳 ZH</option>
                </select>

                <a href="/login.html" class="px-5 py-2.5 rounded-full font-medium text-slate-700 hover:text-blue-600 transition" data-i18n="nav.login">Connexion</a>
                <a href="/register.html" class="bg-blue-600 text-white px-5 py-2.5 rounded-full font-bold shadow-lg shadow-blue-600/20 hover:bg-blue-700 transition" data-i18n="nav.register">Inscription</a>
            </div>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="flex-1 flex items-center justify-center px-4 py-28">
        <div class="bg-white p-8 md:p-10 rounded-3xl border border-slate-100 shadow-xl w-full max-w-md">
            
            <div class="text-center mb-8">
                <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2" data-i18n="register.title">Créer un compte</h2>
                <p class="text-slate-500 text-sm" data-i18n="register.subtitle">Commencez votre voyage avec TravelMS</p>
            </div>

            <form id="register-form" class="space-y-5">
                <div>
                    <label for="name" class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="register.name_label">Nom complet</label>
                    <input type="text" id="name" name="name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" data-i18n-placeholder="register.name_placeholder" placeholder="Jean Dupont" required autocomplete="name">
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="register.email_label">Adresse email</label>
                    <input type="email" id="email" name="email" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" data-i18n-placeholder="register.email_placeholder" placeholder="jean.dupont@exemple.com" required autocomplete="email">
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="register.password_label">Mot de passe</label>
                    <div class="relative">
                        <input type="password" id="password" required 
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm pr-12 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" 
                            data-i18n-placeholder="register.password_placeholder" placeholder="••••••••" autocomplete="new-password">
                        <!-- Bouton de l'œil magique -->
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 transition">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-600/20 transition duration-200 mt-2" data-i18n="register.submit">Créer mon compte et voyager</button>
            </form>

            <p class="text-center text-xs text-slate-400 mt-4" data-i18n="register.security">🔒 Vos données sont protégées et sécurisées.</p>

            <div class="text-center text-sm text-slate-500 mt-6">
                <span data-i18n="register.has_account">Déjà un compte ?</span> <a href="/login.html" class="text-blue-600 font-semibold hover:underline" data-i18n="nav.login">Se connecter</a>
            </div>

        </div>
    </main>

    <!-- Pied de page -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center text-sm mt-auto">
        <p>&copy; <span id="current-year"></span> TravelMS. <span data-i18n="footer.rights">Tous droits réservés.</span></p>
    </footer>

            zh: {

        function setLanguage(lang) {
            localStorage.setItem('travelms_lang', lang);
            document.documentElement.setAttribute('lang', lang);

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    el.setAttribute('placeholder', translations[lang][key]);
                }
            });

            const select = document.getElementById('langSwitch');
            if (select) select.value = lang;
        }

        const savedLang = localStorage.getItem('travelms_lang') || 'fr';
        setLanguage(savedLang);

        document.getElementById('langSwitch').addEventListener('change', (e) => {
            setLanguage(e.target.value);
        });

        // 1. Gestion de l'Œil magique
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                togglePassword.innerHTML = `
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.027 10.027 0 01-4.132 5.411m0 0L21 21" />
                    </svg>`;
            } else {
                togglePassword.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>`;
            }
        });

        // 2. Fonction Toast pour les notifications
        function showToast(message, type = 'success') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'fixed top-5 right-5 z-50 flex flex-col space-y-3';
                document.body.appendChild(container);
            }
            
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : 'bg-rose-600';
            
            toast.className = `${bgClass} text-white px-6 py-3.5 rounded-2xl shadow-xl flex items-center space-x-3 transition-all transform translate-y-2 opacity-0 duration-300 font-medium text-sm`;
            
            const icon = type === 'success' ? '✅' : '⚠️';
            toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // 3. Soumission du formulaire d'inscription
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');

            const currentLang = localStorage.getItem('travelms_lang') || 'fr';
            submitBtn.textContent = translations[currentLang]["register.submitting"];
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || data.message || translations[currentLang]["register.error_default"]);
                }

                showToast(translations[currentLang]["register.success_msg"], "success");

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);

            } catch (err) {
                showToast(err.message, "error");
                submitBtn.textContent = translations[currentLang]["register.submit"];
                submitBtn.disabled = false;
            }
        });
    </script>
