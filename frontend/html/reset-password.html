<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe — TravelMS</title>
    <link rel="icon" href="/assets/favicon.ico">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-slate-50 via-slate-100 to-slate-200 text-slate-800 font-sans">

    <!-- En-tête -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm w-full">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="text-2xl font-black text-blue-600 tracking-tight no-underline">Travel<span class="text-slate-900">MS</span></a>
            
            <!-- Sélecteur de langue -->
            <select id="langSwitch" class="bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600 cursor-pointer">
                <option value="fr">🇫🇷 FR</option>
                <option value="en">🇬🇧 EN</option>
                <option value="es">🇪🇸 ES</option>
                <option value="ru">🇷🇺 RU</option>
                <option value="it">🇮🇹 IT</option>
                <option value="zh">🇨🇳 ZH</option>
            </select>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="bg-white p-8 md:p-10 rounded-3xl border border-slate-100 shadow-xl w-full max-w-md">
            
            <div class="text-center mb-8">
                <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2" data-i18n="reset.title">Nouveau mot de passe</h2>
                <p class="text-slate-500 text-sm" data-i18n="reset.subtitle">Veuillez entrer votre nouveau mot de passe sécurisé.</p>
            </div>

            <form id="reset-form" class="space-y-5">
                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-2" data-i18n="reset.password_label">Nouveau mot de passe</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm pr-12 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" data-i18n-placeholder="reset.password_placeholder" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                        <!-- Bouton de l'œil magique -->
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 transition">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-600/20 transition duration-200 mt-2" data-i18n="reset.submit">Mettre à jour le mot de passe</button>
            </form>

        </div>
    </main>

    <!-- Pied de page -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center text-sm mt-auto">
        <p>&copy; <span id="current-year"></span> TravelMS. <span data-i18n="footer.rights">Tous droits réservés.</span></p>
    </footer>
    <script src="/js/config.js" defer></script>
    <script src="/js/pages/reset-password.js" defer></script>
</body>
</html>
