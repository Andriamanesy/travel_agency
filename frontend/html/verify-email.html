<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification de l'e-mail — TravelMS</title>
    <link rel="icon" href="/assets/favicon.ico">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-slate-50 via-slate-100 to-slate-200 text-slate-800 font-sans">

    <!-- En-tête fixe -->
    <header class="bg-white/85 backdrop-blur-md shadow-sm fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="text-2xl font-black text-blue-600 tracking-tight no-underline">Travel<span class="text-slate-900">MS</span></a>
            <div class="flex items-center space-x-4">
                <!-- Sélecteur de langue -->
                <select id="langSwitch" class="bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600 cursor-pointer">
                    <option value="fr">🇫🇷 FR</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="ru">🇷🇺 RU</option>
                    <option value="it">🇮🇹 IT</option>
                    <option value="zh">🇨🇳 ZH</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="flex-1 flex items-center justify-center px-4 py-28">
        <div class="bg-white p-8 md:p-10 rounded-3xl border border-slate-100 shadow-xl w-full max-w-md text-center">
            
            <!-- Icône dynamique d'état -->
            <div id="status-icon" class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-3xl font-bold mx-auto mb-6 animate-pulse">
                ⏳
            </div>

            <!-- Titre et sous-titre -->
            <h2 id="status-title" class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2" data-i18n="verify.loading_title">Vérification en cours</h2>
            <p id="status-message" class="text-slate-500 text-sm leading-relaxed mb-8" data-i18n="verify.loading_subtitle">Veuillez patienter pendant que nous validons votre adresse e-mail.</p>

            <div id="security-note" class="mb-6 rounded-2xl bg-slate-50 px-4 py-3 text-left text-xs leading-relaxed text-slate-500">
                Pour votre sécurité, un lien de validation ne peut être utilisé qu'une seule fois.
            </div>

            <!-- Action de redirection (masquée par défaut ou activée selon le résultat) -->
            <div id="action-container" class="hidden">
                <a href="/login.html" id="action-btn" class="w-full inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-600/20 transition duration-200" data-i18n="verify.login_btn">Se connecter</a>
            </div>

        </div>
    </main>

    <!-- Pied de page -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center text-sm mt-auto">
        <p>&copy; <span id="current-year"></span> TravelMS. <span data-i18n="footer.rights">Tous droits réservés.</span></p>
    </footer>

    <!-- Script de gestion (Multilingue & API Verification) -->
    <script src="/js/config.js" defer></script>
    <script src="/js/pages/verify-email.js" defer></script>
</body>
</html>
